spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    lk.ceylonpick: INFO

management:
  endpoint:
    health:
      show-details: never

ceylonpick:
  auth:
    jwt:
      secret: ${JWT_SECRET}     # required; startup fails without it
    cookie:
      secure: true
    otp:
      expose-code: false
