spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    lk.ceylonpick: DEBUG

ceylonpick:
  auth:
    jwt:
      secret: ${JWT_SECRET}     # required; startup fails without it
    cookie:
      secure: true
    otp:
      expose-code: false
