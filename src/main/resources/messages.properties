# English — the fallback bundle.
# A key missing from messages_si or messages_ta resolves here, so this file
# must stay complete. Keys are error.<CODE>, where CODE is the ApiException
# code the API returns; the front end branches on the code, never on this text.

# --- session -----------------------------------------------------------------
error.UNAUTHENTICATED=Sign in to continue
error.FORBIDDEN=You do not have access to this
error.NO_SESSION=No session to refresh
error.INVALID_SESSION=Session is not valid
error.SESSION_EXPIRED=Session has expired
error.SESSION_REVOKED=Session is no longer valid

# --- sign-in -----------------------------------------------------------------
# Deliberately identical for an unknown account and a wrong password.
error.INVALID_CREDENTIALS=Email or password is incorrect
error.ACCOUNT_LOCKED=Too many failed attempts. Try again later.
error.ACCOUNT_UNAVAILABLE=This account is not active
error.NO_SECOND_FACTOR_PHONE=This account needs a mobile number before it can sign in. Contact an owner.

# --- details -----------------------------------------------------------------
error.INVALID_EMAIL=Enter a valid email address
error.INVALID_PHONE=Enter a valid Sri Lankan mobile number
error.NO_PHONE=Add a mobile number before editing bank details
error.WEAK_PASSWORD=Password must be at least {0} characters
error.WEAK_PASSWORD_IS_EMAIL=Password must not be your email address
error.EMAIL_IN_USE=That email is already in use
error.ALREADY_REGISTERED=An account already exists for these details
error.INVALID_TOKEN=That link has expired or was already used

# --- OTP (BR-07) -------------------------------------------------------------
error.OTP_INVALID=That code is not correct
error.OTP_EXPIRED=This code has expired. Request a new one.
error.OTP_ALREADY_USED=This code has already been used
error.OTP_NOT_CONFIRMED=Confirm the code again
error.OTP_ATTEMPTS_EXCEEDED=Too many attempts. Request a new code.
error.OTP_RESEND_LIMIT=No more resends for this request
error.OTP_RATE_LIMITED=Too many codes requested for this number. Try again in an hour.
error.OTP_UNKNOWN=That request has expired
error.OTP_WRONG_PURPOSE=This code cannot be used here
error.OTP_WRONG_USER=This code belongs to another account

# --- admin -------------------------------------------------------------------
error.UNKNOWN_USER=No such user
error.UNKNOWN_ADMIN=No such admin
error.LAST_OWNER=This is the only owner. Promote another admin first.

# --- requests ----------------------------------------------------------------
error.VALIDATION_FAILED=Check the highlighted fields
error.INVALID_DATE_RANGE=The end date is before the start date
error.INTERNAL=Something went wrong. Please try again.

# --- confirmations -----------------------------------------------------------
message.SIGNED_OUT=Signed out
message.SESSION_REFRESHED=Session refreshed
message.OTP_SENT=A new code is on its way
message.REGISTERED=Account created. Check your email to confirm it.
message.EMAIL_CONFIRMED=Email confirmed
message.PASSWORD_CHANGED=Password changed. Sign in again.
message.PASSWORD_RESET_SENT=If that address has an account, a reset link is on its way
message.STEP_UP_VERIFIED=Verified
message.ACCOUNT_DISABLED=Account disabled
message.ACCOUNT_ENABLED=Account enabled
